# The Xcode project is made from this file (XcodeGen): `brew install xcodegen && xcodegen` in this folder,
# then open ContrastInk.xcodeproj. The made project is not kept in git.
name: ContrastInk
options:
  bundleIdPrefix: com.contrast
  deploymentTarget:
    iOS: "16.0"
packages:
  ContrastInkCore:
    path: Core
targets:
  ContrastInk:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: ContrastInkCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Contrast Ink
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSMicrophoneUsageDescription: Contrast Ink records your voice with the slides when you press record.
        NSPhotoLibraryAddUsageDescription: Contrast Ink saves your recorded lectures to Photos.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.contrast.ink
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  ContrastInkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ContrastInk
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.contrast.ink.uitests
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ContrastInk:
    build:
      targets:
        ContrastInk: all
    test:
      targets: [ContrastInkUITests]
