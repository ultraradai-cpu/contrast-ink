name: Android

# Every push that changes the Android app: test the shared rules, build the APK, run the app on an Android
# emulator over another app (tap-through, every tool, undo, clear, eraser, recording, pad mode), on Android 10, 14
# and 15, and keep the screenshots as "android-screenshots-api<N>". On main, the APK also goes to the "android-latest" release: one download link.
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (emulator API ${{ matrix.api }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 35 and 34: clean recording (one app, the video drawing); 29: the old path, the whole screen straight to
        # the encoder. Tests of recording one app skip themselves where Android doesn't offer "A single app".
        api: [29, 34, 35]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: The signing key, from the repository's secrets (if set)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/personal.jks"
            echo "CONTRAST_KEYSTORE=$RUNNER_TEMP/personal.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_B64 secret: this APK has a throwaway key (uninstall the old app before installing it)."
          fi
      - name: Test the shared rules, build the APK
        working-directory: android
        env:
          CONTRAST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon :core:test :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Let the emulator use the processor's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the app on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CONTRAST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || touch failed
            adb pull /sdcard/Android/data/ink.contrast/files/shots shots || mkdir -p shots
            test ! -f failed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots-api${{ matrix.api }}
          path: |
            android/shots/
            android/app/build/reports/androidTests/
      - name: Name the APK
        if: matrix.api == 35
        run: cp android/app/build/outputs/apk/release/app-release.apk ContrastInk.apk
      - uses: actions/upload-artifact@v4
        if: matrix.api == 35
        with:
          name: ContrastInk-apk
          path: ContrastInk.apk

  # The release is its own job: it runs only when every emulator job (API 29, 34 and 35) passed, because "needs"
  # waits for the whole matrix and fails if any of it failed, whatever fail-fast says.
  release:
    name: Update the android-latest release (main only)
    needs: android
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ContrastInk-apk
      - name: Update the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built from ${GITHUB_SHA::7}, passed the emulator check. On your Android phone or tablet: download ContrastInk.apk and open it (allow installing from your browser or Files when asked)."
          if gh release view android-latest >/dev/null 2>&1; then
            git tag -f android-latest "$GITHUB_SHA" && git push -f origin refs/tags/android-latest
            gh release upload android-latest ContrastInk.apk --clobber
            gh release edit android-latest --notes "$notes"
          else
            gh release create android-latest ContrastInk.apk --title "Android (latest)" --target "$GITHUB_SHA" --notes "$notes"
          fi
