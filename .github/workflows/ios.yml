name: iOS

# Every push that changes the iPad/iPhone app: test the shared rules, build the app, run it on a simulated iPad
# (draw, change slides, undo, shapes) and keep the screenshots of every step as "ios-screenshots".
# Then build ContrastInk.ipa for a real iPad, unsigned (Sideloadly or AltStore signs it with your own Apple ID).
# On main it goes to the "ios-latest" release: one download link.
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Test the shared rules
        run: swift test --package-path Core
      - name: Make the Xcode project
        run: |
          brew install xcodegen
          xcodegen
      - name: Build, and run the app on a simulated iPad
        run: |
          set -o pipefail
          sim=$(xcrun simctl list devices available | grep -E '^\s+iPad' | head -1 | sed -E 's/^ *(.*) \(([0-9A-F-]{36})\).*/\2/')
          echo "simulator: $(xcrun simctl list devices available | grep "$sim")"
          xcodebuild test -project ContrastInk.xcodeproj -scheme ContrastInk \
            -destination "id=$sim" -resultBundlePath results.xcresult \
            CODE_SIGNING_ALLOWED=NO > test.log 2>&1 || { tail -200 test.log; exit 1; }
          tail -200 test.log
      - name: Save the screenshots
        if: always()
        run: |
          mkdir -p shots
          if [ -d results.xcresult ]; then
            xcrun xcresulttool export attachments --path results.xcresult --output-path shots || true
          fi
          ls -la shots
          # a skipped test is not a pass: say so on the run's page
          [ -f test.log ] && grep -E "Test skipped - " test.log | sed -E 's/^.*(-\[[^]]*\]).*Test skipped - (.*)$/\1: \2/' | sort -u | while read -r line; do echo "::warning title=Skipped UI test::$line"; done || true
          # every failed check, with the steps just before it (the tail above can miss an early test's)
          if [ -f test.log ]; then grep -n -B12 -E "error: -\[|Test Case .* failed" test.log | grep -v -E "Requesting snapshot|Checking existence|Find the" | tail -300 || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-screenshots
          path: ios/shots/
      - name: Build ContrastInk.ipa for a real iPad (unsigned)
        run: |
          set -o pipefail
          xcodebuild build -project ContrastInk.xcodeproj -scheme ContrastInk -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -40
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ContrastInk.app Payload/
          zip -qry ContrastInk.ipa Payload
          ls -la ContrastInk.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ContrastInk-ipa
          path: ios/ContrastInk.ipa
      - name: Update the ios-latest release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Built from ${GITHUB_SHA::7}, passed the simulated-iPad check. Unsigned: install it with Sideloadly or AltStore and your Apple ID (see ios/README.md, Install on your iPad)."
          if gh release view ios-latest >/dev/null 2>&1; then
            git tag -f ios-latest "$GITHUB_SHA" && git push -f origin refs/tags/ios-latest
            gh release upload ios-latest ContrastInk.ipa --clobber
            gh release edit ios-latest --notes "$notes"
          else
            gh release create ios-latest ContrastInk.ipa --title "iPad (latest)" --target "$GITHUB_SHA" --notes "$notes"
          fi
