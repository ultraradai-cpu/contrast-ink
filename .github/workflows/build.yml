name: Build

# Every push to main: run the tests, build ContrastInk.exe, and put it on the "Latest" release
# so there is always one download link: Releases → Latest → ContrastInk.exe
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels an older build still running: an older build finishing last once replaced the download
# with older code. (The release step also checks it is still the branch's newest commit, for a build already past
# the point where cancelling can stop it.)
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test tests/ContrastInk.Core.Tests -c Release
      - name: Build ContrastInk.exe
        run: >
          dotnet publish src/ContrastInk -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out
      - uses: actions/upload-artifact@v4
        with:
          name: ContrastInk
          path: out/ContrastInk.exe
      # Runs the real ContrastInk.exe on this Windows machine and reads the screen back (tests/ContrastInk.WindowsCheck).
      # The control run switches hiding off and must SEE the toolbar, so the "hidden" check is known to be able to fail.
      # A failure here stops the release below: the download link keeps the last build that passed.
      - name: Windows check (real app, real screen)
        shell: pwsh
        run: |
          dotnet build tests/ContrastInk.WindowsCheck -c Release -o check
          $exe = (Resolve-Path out/ContrastInk.exe).Path
          $codes = @{}
          foreach ($m in 'control','normal') {
            $p = Start-Process -FilePath check/ContrastInk.WindowsCheck.exe -ArgumentList "`"$exe`"", 'shots', $m -Wait -PassThru
            $codes[$m] = $p.ExitCode
            Get-Content "shots/results-$m.txt" -ErrorAction SilentlyContinue
          }
          "exit codes: control=$($codes['control']) normal=$($codes['normal'])"
          if ($codes['control'] -ne 0 -or $codes['normal'] -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-check-screenshots
          path: shots/
      - name: Update the Latest release
        if: github.ref == 'refs/heads/main'   # a branch build is checked, never published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # an older build never replaces a newer one: only the branch's newest commit is published
          tip=$(git ls-remote origin "$GITHUB_REF" | cut -f1)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            echo "Not published: ${GITHUB_SHA::7} is no longer the newest commit on $GITHUB_REF (${tip::7} is)."
            exit 0
          fi
          # replace the file in place: never a moment (or a failed step) with no download at all
          notes="Built from ${GITHUB_SHA::7}, passed the Windows check. Download ContrastInk.exe and run it (no install needed)."
          if gh release view latest >/dev/null 2>&1; then
            git tag -f latest "$GITHUB_SHA" && git push -f origin refs/tags/latest   # the tag follows the code that was checked
            gh release upload latest out/ContrastInk.exe --clobber
            gh release edit latest --notes "$notes"
          else
            gh release create latest out/ContrastInk.exe --title "Latest" --target "$GITHUB_SHA" --notes "$notes"
          fi
