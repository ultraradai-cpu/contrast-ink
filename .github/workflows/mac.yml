name: Mac

# Every push that changes the Mac app (or the shared rules it uses): test the rules (Core's and the Mac's own,
# including the tablet link's server paired with on loopback ports), build the app, start it once to check it comes
# up (a smoke test: drawing layer, toolbar, a mark drawn and seen), and zip it as ContrastInk-Mac.zip (unsigned).
# On main it goes to the "mac-latest" release: one download link.
on:
  push:
    paths: ["mac/**", "ios/Core/**", ".github/workflows/mac.yml"]
  workflow_dispatch:

permissions:
  contents: write

# One run at a time for each branch: a newer push cancels an older run still going, so an older build can't finish
# after a newer one and replace its release (the release step also checks it is still main's tip).
concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: Mac (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-14 was tried for the smoke test (ScreenCaptureKit differs by version): GitHub no longer runs it
        # ("The configuration 'macos-14-arm64-us-default' is not supported"), so macOS 15 only
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v4
      - name: Test the release guard (publish only main's tip)
        run: |
          sh ci/still-tip.sh abc1234 abc1234
          if sh ci/still-tip.sh abc1234 def5678; then echo "an older build would be published"; exit 1; fi
          if sh ci/still-tip.sh abc1234 ""; then echo "an unknown tip would be published"; exit 1; fi
      - name: Ink colours are sRGB (no device-RGB setStrokeColor/setFillColor(red:...) in the app)
        run: |
          if grep -n "setStrokeColor(red:\|setFillColor(red:" App/*.swift; then
            echo "::error::device-RGB colour above: use Overlay.srgb / CGColor(srgbRed:...)"; exit 1
          fi
      - name: Test the shared rules (ios/Core)
        run: swift test --package-path ../ios/Core
      - name: Test the Mac's rules and the tablet link's server
        run: swift test --package-path PCCore
      - name: Make the Xcode project
        run: |
          # no project.yml is a broken checkout, not a reason to skip the build, the smoke test and the release
          if [ ! -f project.yml ]; then echo "::error::mac/project.yml is missing: nothing to build"; exit 1; fi
          brew install xcodegen
          xcodegen
      - name: Build (Release, unsigned)
        run: |
          set -o pipefail
          xcodebuild build -project ContrastInk.xcodeproj -scheme ContrastInk -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO | tail -60
          ls -la build/Build/Products/Release/
      - name: Start the app once (smoke test)
        run: |
          # GitHub's Macs allow Screen Recording: the smoke test captures the screen as the tablet does (ScreenCaptureKit)
          # and checks the toolbar is left out. Where it isn't allowed, the log says "LIVE CAPTURE NOT TESTED".
          sw_vers
          app=build/Build/Products/Release/ContrastInk.app/Contents/MacOS/ContrastInk
          "$app" --smoke-test > smoke.log 2>&1 &
          pid=$!
          for i in $(seq 1 60); do
            if ! kill -0 $pid 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 $pid 2>/dev/null; then kill -9 $pid; echo "smoke test hung"; cat smoke.log; exit 1; fi
          code=0; wait $pid || code=$?
          cat smoke.log
          test $code -eq 0
          grep -q "SMOKE OK" smoke.log
          # the toolbar left out of the tablet's picture is only proven by a live capture: none is a failure
          if grep -q "LIVE CAPTURE NOT TESTED" smoke.log; then echo "::error::the live capture check didn't run"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-smoke-captures-${{ matrix.os }}
          path: mac/smoke-capture-*.jpg
          if-no-files-found: ignore
      - name: Zip ContrastInk-Mac.zip
        if: matrix.os == 'macos-15'
        run: |
          cd build/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent ContrastInk.app "$GITHUB_WORKSPACE/mac/ContrastInk-Mac.zip"
          ls -la "$GITHUB_WORKSPACE/mac/ContrastInk-Mac.zip"
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-15'
        with:
          name: ContrastInk-Mac
          path: mac/ContrastInk-Mac.zip

  # The release is its own job: only after every Mac job (15 and 14) passed, on main.
  release:
    name: Update the mac-latest release (main only)
    needs: mac
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ContrastInk-Mac
      - name: Update the mac-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # an older build that finished late: main has a newer commit, whose own run publishes it. A failed lookup
          # fails the job (it is not taken for "not the tip")
          if ! tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha) || [ -z "$tip" ]; then
            echo "::error::couldn't look up main's tip: not publishing"; exit 1
          fi
          if ! sh mac/ci/still-tip.sh "$GITHUB_SHA" "$tip"; then echo "::notice::not main's tip: not published"; exit 0; fi
          notes="Built from ${GITHUB_SHA::7}, passed the rules' tests and the start-up check. Unsigned: unzip it, then right-click ContrastInk.app → Open the first time (see mac/README.md)."
          if gh release view mac-latest >/dev/null 2>&1; then
            git tag -f mac-latest "$GITHUB_SHA" && git push -f origin refs/tags/mac-latest
            gh release upload mac-latest ContrastInk-Mac.zip --clobber
            gh release edit mac-latest --notes "$notes"
          else
            gh release create mac-latest ContrastInk-Mac.zip --title "Mac (latest)" --target "$GITHUB_SHA" --notes "$notes"
          fi
